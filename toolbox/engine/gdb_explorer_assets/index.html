<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="../launcher/workspace-link.css">
<link rel="stylesheet" href="../launcher/tooltips.css"></head>
<body data-gdb-import-shell>
<div class="shell">
  <header class="hero"><a class="suiteReturn" href="../index.html" aria-label="Return to launcher" title="Return to launcher">←</a>
    <div>
      <div class="eyebrow" id="gdbEyebrow"></div>
      <h1>Geodatabase Explorer</h1>
    </div>
    <div class="heroTools"><div class="gdbImportControls" aria-label="GDB Explorer File controls"><input id="gdbZipInput" type="file" accept=".zip,application/zip" aria-label="Choose a GDB Explorer File" hidden><button id="gdbOpenZip" class="iconBtn" type="button">Open GDB Explorer File</button><button id="gdbCancelImport" class="iconBtn" type="button" hidden>Cancel import</button><button id="gdbClearImport" class="iconBtn" type="button" disabled>Clear GDB Explorer File</button></div>
      <button class="iconBtn" id="themeToggle" type="button" title="Toggle light/dark theme">Light theme</button>
    </div>
  </header>

  <div class="gdbImportMessages"><span id="gdbImportStatus" role="status" aria-live="polite"></span><span id="gdbImportError" role="alert"></span></div><div class="workbench">
    <aside class="sidebar" id="sidebar">
      <fieldset class="tocFrame tocLegendFrame">
        <legend>Legend</legend>
        <div id="treeLegend" class="tocLegend" role="group" aria-label="Catalogue icon legend"></div>
      </fieldset>
      <fieldset class="tocFrame tocContentsFrame">
        <legend>GBD Contents</legend>
        <div class="expandLevelControl" role="group" aria-label="Hierarchy expansion level">
          <div class="expandPills" id="expandPills">
            <button class="expandPill" data-level="1" type="button">Database</button>
            <button class="expandPill" data-level="2" type="button">Folders</button>
            <button class="expandPill active" data-level="3" type="button">Layers</button>
          </div>
        </div>
        <input class="search" id="treeSearch" aria-label="Filter the geodatabase catalogue" type="search" placeholder="Filter datasets, layers or attributes…">
        <nav class="tree" id="tree">
          <div id="treeNodes"></div>
        </nav>
      </fieldset>
    </aside>

    <div class="resizer" id="resizer" title="Drag to resize navigation"></div>

    <main class="main">
      <section class="workspace" id="workspace">
        <div class="contextHead" id="contextHead">
          <div>
            <h2 id="layerTitle">Select a layer</h2>
            <div class="contextMeta" id="layerMeta">Choose a layer from the explorer to load it.</div>
          </div>
          <div class="pills" id="layerPills"></div>
        </div>
        <div class="tabs" id="tabs">
          <button class="tab active" data-tab="attributes" type="button">Attribute Table</button>
          <button class="tab" data-tab="schema" type="button">Schema</button>
          <button class="tab" data-tab="analytics" type="button">Analytics</button>
          <button class="tab" data-tab="attachments" type="button" id="attachmentTab">Attachments</button>
          <button class="tab" data-tab="spatial" type="button" id="spatialTab">Spatial</button>
          <button class="tab" data-tab="storage" type="button">Storage</button>
          <button class="tab" data-tab="metadata" type="button">Metadata</button>
        </div>
        <div class="panel" id="panel">
          <div class="welcome"><div><strong>GDB Explorer</strong>Loading workspace…</div></div>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modalHead">
    <strong id="modalTitle"></strong>
    <a class="btn" id="modalDownload" href="#" download>Download</a>
    <button class="iconBtn" id="modalClose" type="button">Close</button>
  </div>
  <div class="modalBody" id="modalBody"></div>
</div>

<dialog id="metroDialog" class="apiKeyDialog" aria-labelledby="metroDialogTitle" aria-describedby="metroDialogHelp">
  <div class="apiKeyDialogHead">
    <h2 id="metroDialogTitle">MetroMap API key</h2>
    <button id="closeMetroDialog" class="iconBtn" type="button" aria-label="Close MetroMap settings">Close</button>
  </div>
  <p id="metroDialogHelp">Enter a key to use MetroMap. Save it only if you want this browser to remember it.</p>
  <label class="apiKeyField" for="metroKey">API key
    <input id="metroKey" class="metroKey" type="password" autocomplete="off" spellcheck="false">
  </label>
  <p id="metroKeyStatus" class="keyStatus" role="status" aria-live="polite"></p>
  <div class="apiKeyDialogActions">
    <button id="useMetroKey" class="btn" type="button">Use MetroMap</button>
    <button id="saveMetroKey" class="btn" type="button">Save key in browser</button>
    <button id="removeMetroKey" class="btn" type="button">Remove saved key</button>
  </div>
</dialog>

<template id="gdbFileWelcome">
  <section class="gdb-file-welcome" aria-labelledby="gdbFileGuideTitle">
    <div class="gdb-file-toolbox">
      <div class="toolbox-lid" aria-hidden="true"><img src="assets/toolbox.svg" alt="" width="37" height="29"></div>
      <div class="toolbox-face">
        <h2 id="gdbFileGuideTitle">Create a GDB Explorer File</h2>
        <ol>
          <li>In ArcGIS Pro, add the <strong>GDB Explorer</strong> toolbox.</li>
          <li>Open <strong>Create GDB Explorer File</strong>.</li>
          <li>Choose your geodatabase and output file, then <strong>Run</strong>.</li>
          <li>Click <strong>Open GDB Explorer File</strong> here.</li>
        </ol>
      </div>
    </div>
  </section>
</template>
<script src="js/bootstrap.js" defer></script>
<script src="../launcher/tooltips.js" defer></script></body>
</html>
