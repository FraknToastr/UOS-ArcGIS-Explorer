  color-scheme:light;
  --page-bg:#fff;
  --ink:#111118;
  --uos-grid-colour:#91AD88;
  --line:rgba(17,17,24,.18);
  --logo-height:36px;
  --accent-width:4px;
  --brand-gap:10px;
  --grid-icon-size:clamp(20px,2.25vw,40px)
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:var(--page-bg)}
body{min-height:100vh;min-height:100dvh;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--page-bg)}
.logo-grid{position:fixed;inset:0;z-index:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(12,minmax(0,1fr));perspective:1000px;pointer-events:none;overflow:hidden}
.logo-cell{display:grid;place-items:center;min-width:0;min-height:0;transform-style:preserve-3d}
.logo-spinner{width:var(--grid-icon-size);height:var(--grid-icon-size);display:grid;place-items:center;transform-style:preserve-3d;animation:spin3d var(--duration) linear infinite;animation-delay:var(--delay)}
.chatgpt-icon{width:100%;height:100%;display:block;background:#000;-webkit-mask-image:var(--chatgpt-mask);mask-image:var(--chatgpt-mask);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;opacity:1;filter:none}
#logoGrid[data-mode="alternating"] .chatgpt-icon{transform:scale(1.56);transform-origin:center}
.arcgis-icon,.toolbox-icon{width:100%;height:100%;display:block;object-fit:contain;opacity:1;filter:none;mix-blend-mode:normal}
.arcgis-icon{transform:scale(1.56);transform-origin:center}
.toolbox-icon{transform:scale(1.38);transform-origin:center}
@keyframes spin3d{0%{transform:rotateX(0) rotateY(0) rotateZ(0) scale(.86)}25%{transform:rotateX(var(--x1)) rotateY(var(--y1)) rotateZ(4deg) scale(1)}50%{transform:rotateX(var(--x2)) rotateY(var(--y2)) rotateZ(0) scale(.88)}75%{transform:rotateX(var(--x3)) rotateY(var(--y3)) rotateZ(-4deg) scale(1)}100%{transform:rotateX(360deg) rotateY(360deg) rotateZ(0) scale(.86)}}
.app-shell{position:relative;z-index:1;width:100%;height:100vh;height:100dvh;display:grid;place-items:center;padding:8px}
.site-header{position:fixed;right:8px;bottom:8px;z-index:3;display:flex;align-items:center;justify-content:flex-end;width:auto;min-height:var(--logo-height);pointer-events:none}
.uos-brand{display:flex;align-items:stretch;justify-content:flex-end;height:var(--logo-height);max-width:calc(100vw - 16px)}
.uos-logo{display:block;width:auto;height:var(--logo-height);flex:none;align-self:stretch;margin:0 var(--brand-gap) 0 0}
.uos-accent{display:block;width:var(--accent-width);min-width:var(--accent-width);height:var(--logo-height);min-height:var(--logo-height);max-height:var(--logo-height);margin:0 var(--brand-gap) 0 0;padding:0;flex:0 0 var(--accent-width);align-self:stretch;background-color:var(--uos-grid-colour)!important}
.uos-wordblock{height:var(--logo-height);min-height:var(--logo-height);max-height:var(--logo-height);display:grid;grid-template-rows:repeat(3,1fr);align-items:stretch;margin:0 var(--brand-gap) 0 0;color:var(--ink);font-size:clamp(.40rem,.58vw,.52rem);font-weight:900;line-height:1;letter-spacing:.02em;white-space:nowrap}
.uos-wordblock:last-child{margin-right:0}
.uos-wordblock span{display:flex;align-items:center;line-height:1}
.uos-wordblock span:first-child{align-items:flex-start}
.uos-wordblock span:nth-child(2){align-items:center}
.uos-wordblock span:last-child{align-items:flex-end}
.factory-stage{position:relative;width:min(1480px,90vw,calc(82vh * 1.5));height:auto;max-height:82vh;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center}
.factory-frame{margin:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:24px;border:2px solid rgba(17,17,24,.18);background:#fff;box-shadow:0 20px 54px rgba(17,17,24,.16)}
.factory-frame img{display:block;width:100%;height:100%;object-fit:contain;object-position:center center}
